[package]
name = "edittr"
version = "0.1.0"
edition = "2024"
description = "Lightweight code editor with git built in"
license = "MIT"
repository = "https://github.com/term-guy/edittr"

[dependencies]
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "clipboard", "links", "default_fonts", "system_fonts", "wayland", "x11"] }
fontique = "0.11.1"
skrifa = "0.44.0"
# src/highlight.rs drives it directly (incremental), for the editor and diffs.
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
flate2 = "1.1.11"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
notify = "8.2"
quick-xml = { version = "0.42.0", features = ["serialize"] }
regex = "1.13.2"
# Pinned: the Linux portal-failure detection in app.rs relies on rfd 0.18 internals.
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
toml = "1.2.2"
ureq = { version = "3.5.2", features = ["platform-verifier", "win-system-proxy"] }
url = "2.5.9"
yaml-rust = "0.4.5"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
pulldown-cmark = { version = "0.13", default-features = false }
trash = "5.4.0"

[target.'cfg(target_os = "linux")'.dependencies]
log = "0.4"

# Local time zone offsets (SVN stores UTC times).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Time"] }

[features]
# Screenshot tour for docs/testing: see src/app/tour.rs.
tour = ["dep:image"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"

[package.metadata.deb]
name = "edittr"
section = "editors"
priority = "optional"
copyright = "2026 term-guy"
depends = "$auto, git, libxkbcommon-x11-0, libgl1"
recommends = "libwayland-client0"
extended-description = "A small, fast code editor with syntax highlighting, project search, go-to-definition (via language servers) and built-in git: changes, diffs, commits and a commit graph."
assets = [
    ["target/release/edittr", "usr/bin/", "755"],
    ["packaging/linux/edittr.desktop", "usr/share/applications/", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/edittr.png", "644"],
    ["README.md", "usr/share/doc/edittr/README.md", "644"],
]
